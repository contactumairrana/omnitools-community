<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1226" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="180" fill="#3B82F6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="220" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="350" r="160" fill="#06B6D4" opacity="0.08" filter="url(#glow)" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#primaryGlow)" />
    <path d="M 16 26 L 24 34 L 36 18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="68" y="32" class="sans" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">OmniTools</text>
    <text x="212" y="32" class="sans" font-size="20" font-weight="400" fill="#94A3B8">| Ecosystem &amp; Growth Architecture</text>
    
    <!-- Top Live Badges -->
    <g transform="translate(730, 8)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="26" y="18" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">45+ Tools</text>

      <rect x="115" y="0" width="130" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <circle cx="129" cy="14" r="4" fill="#3B82F6" />
      <text x="141" y="18" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">Cloudflare Edge</text>

      <rect x="255" y="0" width="95" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <circle cx="269" cy="14" r="4" fill="#EC4899" />
      <text x="281" y="18" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">100% Client</text>
    </g>
  </g>

  <!-- 4 Pillars Architecture Layout -->

  <!-- Pillar 1: Client-Side Privacy Boundary -->
  <g transform="translate(60, 130)">
    <rect width="250" height="440" rx="16" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="80" height="22" rx="4" fill="rgba(59, 130, 246, 0.2)" />
    <text x="28" y="35" class="mono badge" fill="#60A5FA">LAYER 1</text>
    <text x="20" y="70" class="sans" font-size="18" font-weight="800" fill="#FFFFFF">Client Sandbox</text>
    <text x="20" y="92" class="sans" font-size="12" fill="#94A3B8">100% In-Browser Memory</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 115)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Web Cryptography API</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">AES-256, Bcrypt, HMAC, SHA</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">HTML5 Canvas Engine</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">8K SVG rasterization, QR render</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Client Parsers &amp; AST</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">SQL-to-JSON, TypeScript infer</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="220" height="70" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-opacity="0.3" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="12" fill="#34D399">🛡️ Zero Server Uploads</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#94A3B8">GDPR / CCPA by architecture</text>
      <text x="14" y="58" class="sans" font-size="10" fill="#64748B">Local memory garbage collected</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 310 350 L 340 350" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Pillar 2: Global Edge CDN Infrastructure -->
  <g transform="translate(340, 130)">
    <rect width="250" height="440" rx="16" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="80" height="22" rx="4" fill="rgba(6, 182, 212, 0.2)" />
    <text x="28" y="35" class="mono badge" fill="#22D3EE">LAYER 2</text>
    <text x="20" y="70" class="sans" font-size="18" font-weight="800" fill="#FFFFFF">Edge Global CDN</text>
    <text x="20" y="92" class="sans" font-size="12" fill="#94A3B8">Cloudflare Pages Network</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 115)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">300+ Edge POPs</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Zero-cold-start, &lt;20ms TTFB</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">242 Prerendered Pages</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Static HTML with zero JS penalty</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Offline PWA Runtime</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Full offline caching &amp; install</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="220" height="70" rx="8" fill="rgba(6, 182, 212, 0.1)" stroke="#06B6D4" stroke-opacity="0.3" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="12" fill="#38BDF8">🌍 Quad-Language i18n</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#94A3B8">EN, ES, DE, AR (full RTL)</text>
      <text x="14" y="58" class="sans" font-size="10" fill="#64748B">Canonical hreflang linked</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 590 350 L 620 350" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Pillar 3: Omnichannel Traffic Flywheel -->
  <g transform="translate(620, 130)">
    <rect width="250" height="440" rx="16" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="80" height="22" rx="4" fill="rgba(139, 92, 246, 0.2)" />
    <text x="28" y="35" class="mono badge" fill="#A78BFA">LAYER 3</text>
    <text x="20" y="70" class="sans" font-size="18" font-weight="800" fill="#FFFFFF">Growth Flywheel</text>
    <text x="20" y="92" class="sans" font-size="12" fill="#94A3B8">Inbound Traffic Channels</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 115)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Programmatic SEO</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Sitemaps, FAQ schema, OpenGraph</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Awesome Lists &amp; PRs</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Brad Traversy &amp; Marko Denic</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="220" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Chrome &amp; Edge Extension</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Instant browser toolbar access</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="220" height="70" rx="8" fill="rgba(139, 92, 246, 0.1)" stroke="#8B5CF6" stroke-opacity="0.3" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="12" fill="#C084FC">📈 Organic Compounding</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#94A3B8">High DA developer backlinks</text>
      <text x="14" y="58" class="sans" font-size="10" fill="#64748B">Daily recurring active users</text>
    </g>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <path d="M 870 350 L 900 350" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Pillar 4: Community & Innovation Gateway -->
  <g transform="translate(900, 130)">
    <rect width="240" height="440" rx="16" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="80" height="22" rx="4" fill="rgba(236, 72, 153, 0.2)" />
    <text x="28" y="35" class="mono badge" fill="#F472B6">LAYER 4</text>
    <text x="20" y="70" class="sans" font-size="18" font-weight="800" fill="#FFFFFF">Community Hub</text>
    <text x="20" y="92" class="sans" font-size="12" fill="#94A3B8">Public Feedback Gateway</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 115)">
      <rect width="210" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">Public Issue Tracker</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Tool requests &amp; Bug reports</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="210" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">100% Code Privacy</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Zero source code exposed</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="210" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="13" fill="#E2E8F0">GitHub Stars &amp; Clout</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#64748B">Social proof &amp; dev credibility</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="210" height="70" rx="8" fill="rgba(236, 72, 153, 0.1)" stroke="#EC4899" stroke-opacity="0.3" />
      <text x="14" y="25" class="sans" font-weight="700" font-size="12" fill="#F472B6">🚀 Rapid Feature Pipeline</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#94A3B8">Community driven backlog</text>
      <text x="14" y="58" class="sans" font-size="10" fill="#64748B">Fast deployment to Edge</text>
    </g>
  </g>

  <!-- Bottom Global Footer Banner -->
  <g transform="translate(60, 585)">
    <text x="0" y="20" class="mono" font-size="12" fill="#64748B">https://www.devomnitools.com &bull; Designed &amp; Maintained by Muhammad Umair &bull; Fast, Private &amp; Offline-Ready</text>
  </g>
</svg>
